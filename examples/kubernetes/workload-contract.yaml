# 설계 계약 예시입니다. registry.example image와 외부 ServiceAccount를 포함하므로
# 그대로 apply하지 않습니다. 실행 가능한 local profile은
# examples/optional-labs/kind/workload.yaml을 사용하십시오.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: platform-lab
  labels:
    app.kubernetes.io/name: checkout
    platform.northstar.dev/owner: team-checkout
    platform.northstar.dev/profile: stateless-http-3.2.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout
    spec:
      serviceAccountName: checkout
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: registry.example/checkout@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: platform-lab
spec:
  selector:
    app.kubernetes.io/name: checkout
  ports:
    - name: http
      port: 80
      targetPort: http
