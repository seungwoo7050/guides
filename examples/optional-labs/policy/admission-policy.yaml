apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: platform-guide-image-digest
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - expression: "object.metadata.namespace != 'platform-lab' || object.spec.template.spec.containers.all(c, c.image.matches('^.+@sha256:[0-9a-f]{64}$'))"
      message: "platform-lab workload image에는 immutable sha256 digest가 필요합니다."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: platform-guide-image-digest
spec:
  policyName: platform-guide-image-digest
  validationActions: [Deny]
