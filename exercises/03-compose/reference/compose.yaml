# [Implementation 5] app이 port·volume·network·health의 resource owner가 됩니다.
services:
  app:
    build:
      context: ./app
    environment:
      COUNTER_FILE: /data/counter.txt
    ports:
      - "127.0.0.1:${EXERCISE_PORT:-18083}:8080"
    volumes:
      - app-data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 2s
      timeout: 1s
      retries: 20
      start_period: 2s

  # [Implementation 6] client는 service DNS와 healthy dependency만 소비합니다.
  client:
    image: curlimages/curl:8.10.1
    command: ["-fsS", "http://app:8080/healthz"]
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-net

# [Implementation 7] named network와 volume의 수명을 service 정의와 분리합니다.
networks:
  app-net:
    driver: bridge

volumes:
  app-data:
