services:
  app:
    build:
      context: ./app
    environment:
      COUNTER_FILE: /data/counter.txt
    ports:
      - "127.0.0.1:${EXERCISE_PORT:-18083}:8080"
    volumes:
      - app-data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 2s
      timeout: 1s
      retries: 20
      start_period: 2s

  client:
    image: curlimages/curl:8.10.1
    command: ["-fsS", "http://app:8080/healthz"]
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  app-data:
