# [Implementation 1] 실행 코드보다 먼저 build·Python·console·공개 타입 경계를 고정합니다.
[build-system]
requires = []
build-backend = "_command_checker_build"
backend-path = ["."]

[project]
name = "command-checker"
version = "1.0.0"
description = "Run external commands against JSON case contracts"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
command-checker = "command_checker.cli:main"

[tool.command-checker.type-contract]
require-annotations = true
disallow-any-in-public-api = true
