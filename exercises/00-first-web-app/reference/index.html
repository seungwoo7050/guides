<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>나의 작업 목록</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- [Implementation 1] 먼저 의미 구조와 접근성 계약을 세워 이후 동작과 스타일이 안정된 DOM 경계를 공유하게 합니다. -->
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="site-header">
    <strong>첫 웹 앱</strong>
    <nav aria-label="주 메뉴"><a aria-current="page" href="./">작업</a></nav>
  </header>
  <main id="main" tabindex="-1">
    <h1>나의 작업 목록</h1>
    <form id="task-form">
      <label for="task-title">새 작업</label>
      <div class="form-row">
        <input id="task-title" name="title" maxlength="120" autocomplete="off" />
        <button type="submit">추가</button>
      </div>
    </form>

    <div class="toolbar">
      <label for="filter">표시할 작업</label>
      <select id="filter" name="filter">
        <option value="all">전체</option>
        <option value="open">미완료</option>
        <option value="done">완료</option>
      </select>
    </div>

    <p id="error" role="alert"></p>
    <p id="status" role="status" aria-live="polite"></p>
    <ul id="task-list" class="task-list" aria-label="작업 목록"></ul>
  </main>
</body>
</html>
