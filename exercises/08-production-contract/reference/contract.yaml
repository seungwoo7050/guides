schema_version: 1
service:
  name: notes
  user_capability: 사용자는 공개 HTTPS 주소에서 메모를 읽고 작성할 수 있다.
  owner: service-owner

endpoints:
  public:
    - name: http-acme-and-redirect
      port: 80
      protocol: http
      owner: gateway
    - name: public-https
      port: 443
      protocol: https
      owner: gateway
  management:
    - name: ssh
      port: 22
      protocol: ssh
      source_restriction: provider-firewall-admin-cidr
      owner: operations-owner

data:
  - name: notes-database
    classification: business
    source_of_truth: mariadb-volume
    recovery_source: encrypted-external-backup
    external_recovery_copy: true
    owner: data-owner
    rpo_minutes: 1440
  - name: runtime-secrets
    classification: secret
    source_of_truth: password-manager
    recovery_source: password-manager-and-reissuance
    external_recovery_copy: true
    owner: operations-owner
    rpo_minutes: 0
  - name: release-configuration
    classification: configuration
    source_of_truth: deployment-repository
    recovery_source: signed-release-artifact
    external_recovery_copy: true
    owner: release-owner
    rpo_minutes: 0

objectives:
  rto_minutes: 240
  rpo_minutes: 1440
  availability:
    path: /api/notes
    measurement_location: external-probe
    target_percent: 99.5
    window_days: 30

threat_model:
  trust_boundaries:
    - internet-to-gateway
    - administrator-device-to-ssh
    - ci-to-registry
    - host-to-backup-storage
    - application-to-database
  risks:
    - id: mutable-image-tag
      scenario: 변경 가능한 tag가 검증 뒤 다른 image를 가리킨다.
      prevention: production은 manifest의 exact digest만 배포한다.
      detection: 실행 digest와 release manifest를 비교한다.
      recovery: 이전 호환 digest로 rollback한다.
      owner: release-owner
    - id: host-and-local-backup-loss
      scenario: host disk 장애로 database와 로컬 backup을 함께 잃는다.
      prevention: 암호화 backup을 별도 계정의 외부 저장소로 전송한다.
      detection: backup age와 원격 object 검증 결과를 경보한다.
      recovery: 새 host에 외부 backup을 복원한다.
      owner: operations-owner
    - id: docker-daemon-access
      scenario: 애플리케이션 또는 탈취 계정이 Docker socket으로 host를 제어한다.
      prevention: socket을 application에 mount하지 않고 docker 그룹을 관리자에게만 허용한다.
      detection: socket mount와 그룹 구성원을 정기 감사한다.
      recovery: host를 격리하고 credential을 회전한 뒤 깨끗한 host를 재구축한다.
      owner: operations-owner
    - id: dns-credential-theft
      scenario: 탈취된 DNS token으로 도메인이 공격자 주소를 가리킨다.
      prevention: ACME record에 필요한 최소 zone 권한의 별도 token을 사용한다.
      detection: DNS 변경 알림과 외부 DNS·TLS probe를 사용한다.
      recovery: token을 폐기하고 검증된 record와 인증서를 복구한다.
      owner: operations-owner

residual_risks:
  - id: single-host-outage
    statement: host 또는 공급자 장애 동안 서비스가 중단될 수 있다.
    accepted_by: service-owner
    mitigation: 외부 복구 원본과 240분 RTO의 재구축 runbook을 유지한다.

readiness:
  immutable_release: true
  external_backup: true
  rollback_tested: true
  certificate_monitored: true
  restore_drill_tested: true
