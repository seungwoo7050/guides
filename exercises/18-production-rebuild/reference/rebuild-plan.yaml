schema_version: 1
exercise_id: rebuild-2026-08-07
objectives:
  rto_minutes: 240
  rpo_minutes: 1440
inputs:
  release:
    release_id: 2026-08-01.2
    source_revision: a1b2c3d4e5f60718293a4b5c6d7e8f9012345678
    images:
      gateway: registry.example/gateway@sha256:1111111111111111111111111111111111111111111111111111111111111111
      app: registry.example/app@sha256:2222222222222222222222222222222222222222222222222222222222222222
      database: registry.example/database@sha256:3333333333333333333333333333333333333333333333333333333333333333
    provenance_verified: true
    configuration_schema: 3
    database_schema_min: 17
    database_schema_max: 18
  rollback:
    release_id: 2026-07-25.3
    app_image: registry.example/app@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    database_schema_min: 17
    database_schema_max: 18
  backup:
    backup_id: 2026-08-07T020000Z
    manifest_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    external_location: s3://separate-backup-account/notes/2026-08-07T020000Z
    latest_record_at: "2026-08-07T01:55:00Z"
  secrets:
    - name: db_password_v2
      source: password-manager
      owner: operations-owner
    - name: session_key_v3
      source: password-manager
      owner: security-owner
    - name: backup_key_v1
      source: offline-key-custody
      owner: data-owner
stages:
  - id: declare
    order: 1
    owner: incident-commander
    halt_conditions:
      - DNS 또는 backup·secret 권한의 소유자를 확인할 수 없음
    evidence:
      - 복구 시작 시각과 선택한 release·backup
  - id: host
    order: 2
    owner: operations-owner
    halt_conditions:
      - OS architecture가 image와 다름
      - 관리자 SSH 재접속 또는 시간 동기화 실패
    evidence:
      - os-release, Docker·Compose version, port·firewall, disk·inode
  - id: release
    order: 3
    owner: release-owner
    halt_conditions:
      - image digest pull 또는 provenance 검증 실패
      - Compose rendered config 오류
    evidence:
      - exact digest, OCI revision label, release manifest checksum
  - id: secrets
    order: 4
    owner: operations-owner
    halt_conditions:
      - versioned secret 누락 또는 파일 mode 불일치
    evidence:
      - secret 이름·version·fingerprint와 permission, 값은 제외
  - id: restore
    order: 5
    owner: data-owner
    halt_conditions:
      - backup checksum·복호화·schema 검증 실패
      - 대상이 비어 있지 않음
    evidence:
      - backup ID, row·upload checksum, restore 시작·종료 시각
  - id: internal-smoke
    order: 6
    owner: service-owner
    halt_conditions:
      - 외부 효과가 차단되지 않음
      - 읽기·격리 쓰기·재조회 실패
    evidence:
      - loopback gateway와 DB를 통과한 smoke 결과
  - id: tls
    order: 7
    owner: operations-owner
    halt_conditions:
      - hostname SAN·chain·expiry 검증 실패
      - gateway reload 뒤 외부 제공 serial 불일치
    evidence:
      - certificate serial, SAN, issuer, expiry
  - id: dns
    order: 8
    owner: operations-owner
    halt_conditions:
      - A·AAAA 또는 이전 record 원본이 불명확
    evidence:
      - 변경 전후 authoritative DNS 응답
  - id: external-smoke
    order: 9
    owner: service-owner
    halt_conditions:
      - 공개 TLS·읽기·안전한 쓰기·재조회 중 하나라도 실패
    evidence:
      - 외부 probe 응답, request ID와 redacted log
  - id: observability
    order: 10
    owner: monitoring-owner
    halt_conditions:
      - log·metric·외부 probe 또는 test alert가 새 host를 관찰하지 못함
    evidence:
      - dashboard release marker, alert delivery ID, backup·certificate metric
  - id: finalize
    order: 11
    owner: incident-commander
    halt_conditions:
      - RPO·RTO를 계산할 시각 또는 rollback release가 없음
    evidence:
      - current release record, 실제 RPO·RTO, 후속 작업
external_smoke:
  command: curl --fail --show-error --silent --max-time 10 https://notes.example.test/api/notes
  validates:
    - public DNS
    - TLS hostname and chain
    - gateway
    - application
    - database read
  write_probe:
    idempotency_key: rebuild-probe-2026-08-07
    cleanup: 검증 row를 재조회한 뒤 전용 probe namespace에서 삭제
observability:
  external_probe: true
  structured_logs: true
  metrics: true
  certificate_expiry_metric: true
  backup_age_metric: true
  test_alert_delivered: true
measurements:
  recovery_declared_at: "2026-08-07T13:00:00Z"
  service_recovered_at: "2026-08-07T15:25:00Z"
  latest_source_write_at: "2026-08-07T01:59:00Z"
  latest_restored_write_at: "2026-08-07T01:55:00Z"
failure_drills:
  - id: wrong-image-digest
    expected_gate: release preflight
  - id: missing-secret
    expected_gate: secrets stage
  - id: corrupt-backup
    expected_gate: restore checksum
  - id: hostname-mismatch
    expected_gate: TLS and external smoke
  - id: disk-pressure
    expected_gate: host preflight
  - id: bad-release-rollback
    expected_gate: external smoke then exact compatible rollback digest
followups:
  - id: automate-host-audit
    owner: operations-owner
    deadline: "2026-08-21"
    verification: 새 폐기 host에서 audit 결과 critical 0건
  - id: reduce-restore-manual-step
    owner: data-owner
    deadline: "2026-08-28"
    verification: 다음 restore drill의 RTO가 120분 이하
