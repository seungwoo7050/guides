schema_version: 1
incident_id: inc-2026-08-07-01
severity: SEV-2
user_impact: 메모 읽기는 가능하지만 10:05Z부터 다수의 새 메모 작성 요청이 502로 실패한다.
roles:
  incident_commander: ops-lead
  operations: service-owner
  communications: support-owner
  scribe: release-owner
change_freeze: true
observations:
  - id: write-failures
    at: "2026-08-07T10:05:00Z"
    evidence: external write probe에서 62% HTTP 502, read probe는 성공
    fact: 쓰기 사용자 경로에 지속적인 부분 장애가 있다.
  - id: upstream-timeout
    at: "2026-08-07T10:06:00Z"
    evidence: gateway log의 POST /api/notes upstream timeout
    fact: gateway는 쓰기 요청에서 application 응답을 제한 시간 안에 받지 못했다.
  - id: db-pool-saturated
    at: "2026-08-07T10:07:00Z"
    evidence: app pool 95/95, DB connection 96/100
    fact: application과 database connection 여유가 거의 없다.
  - id: disk-pressure
    at: "2026-08-07T10:08:00Z"
    evidence: disk byte 93%, inode 41%, database volume growth 안정
    fact: host disk가 위험 임계값에 가깝지만 database 급증 증거는 없다.
  - id: release-delta
    at: "2026-08-07T10:12:00Z"
    evidence: v2에서 DB pool 설정이 40에서 95로 변경됨
    fact: 사용자 영향 직전 release가 connection budget을 변경했다.
hypotheses:
  - id: pool-overcommit
    statement: v2의 pool 95가 관리자 여유를 없애 쓰기 요청 timeout을 만든다.
    supporting_evidence:
      - db-pool-saturated
      - release-delta
    contradicting_evidence: []
    test: 새 connection 생성을 제한하고 v1 pool 설정의 격리 instance에서 쓰기 probe를 실행한다.
    status: leading
  - id: disk-causes-timeout
    statement: disk 압력이 application timeout의 직접 원인이다.
    supporting_evidence:
      - disk-pressure
    contradicting_evidence:
      - database volume growth가 안정적이고 read probe는 성공한다.
    test: disk latency와 write error를 확인하되 증거 보존 전 광범위한 prune을 실행하지 않는다.
    status: unconfirmed
initial_actions:
  - order: 1
    action: 자동 배포를 중지하고 production 변경을 incident commander 승인 아래 둔다.
    reason: 동시 변경으로 인과관계와 rollback 상태가 섞이는 것을 막는다.
    reversible: true
    owner: incident_commander
  - order: 2
    action: current release·image digest, Compose 상태, gateway/app/DB 로그와 자원 metric을 보존한다.
    reason: container 재생성과 정리 전에 최초 실패 증거를 남긴다.
    reversible: true
    owner: scribe
  - order: 3
    action: 새 쓰기 concurrency를 제한하고 retry 폭증을 막는다.
    reason: DB connection 고갈을 완화하면서 읽기 기능을 유지한다.
    reversible: true
    owner: operations
  - order: 4
    action: schema 18 호환을 재확인한 뒤 exact v1 digest rollback을 준비한다.
    reason: 최근 pool 변경을 가역적으로 제거할 수 있다.
    reversible: true
    owner: operations
rejected_actions:
  - action: docker system prune -a
    reason: 원인 증거와 rollback image를 지울 수 있으며 disk 증가 원인이 아직 분류되지 않았다.
  - action: 모든 container 동시 restart
    reason: 사용자 영향을 넓히고 어느 경계가 실패했는지 판단할 증거를 잃는다.
mitigation:
  action: 쓰기 concurrency를 제한한 뒤 v1 exact digest로 rollback한다.
  success_condition: 외부 쓰기 오류율이 1% 미만이고 DB connection이 85 이하로 15분 유지된다.
  rollback_or_stop_condition: schema 불일치, 데이터 오류 또는 v1에서도 동일한 timeout이 관찰되면 자동 rollback 반복을 중지한다.
  owner: operations
recovery_verification:
  - 외부 DNS와 TLS 검증 성공
  - 외부 메모 읽기 성공
  - 전용 idempotency key를 사용한 메모 쓰기와 재조회 성공
  - DB connection이 관리자 reserve를 남긴 상태로 15분 유지
  - 5xx와 p95 latency가 사고 전 허용 범위로 회복
  - 최근 데이터와 backup 상태에 손상 징후 없음
communication:
  first_message: 10:05Z부터 메모 작성 요청 일부가 실패하고 있습니다. 읽기는 정상이며 쓰기 부하를 제한하고 최근 변경을 되돌리는 중입니다.
  next_update_at: "2026-08-07T10:40:00Z"
  root_cause_claimed: false
  owner: communications
followups:
  - id: enforce-db-connection-budget
    owner: service-owner
    deadline: "2026-08-14"
    action: 모든 app replica pool 합계가 DB max에서 관리자 reserve를 뺀 값 이하인지 배포 preflight에서 검사한다.
    verification: pool 95 fixture가 CI에서 거부되고 대표 부하에서 connection 거부 0건
  - id: disk-growth-runbook
    owner: operations-owner
    deadline: "2026-08-21"
    action: image·log·backup staging별 disk 성장과 안전한 정리 순서를 runbook에 추가한다.
    verification: staging failure drill에서 rollback image를 보존한 채 20% 여유 확보
  - id: external-write-alert
    owner: monitoring-owner
    deadline: "2026-08-14"
    action: 외부 쓰기 probe의 10분 지속 실패를 SEV-2 경보로 연결한다.
    verification: staging에서 dependency timeout 주입 시 경보와 runbook 링크 수신
