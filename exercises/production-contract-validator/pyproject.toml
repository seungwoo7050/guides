# [Implementation 0] Installable package and CLI boundary
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "production-contract-validator"
version = "1.0.0"
description = "Validate production service contracts expressed as YAML."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
production-contract-validator = "production_contract_validator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
