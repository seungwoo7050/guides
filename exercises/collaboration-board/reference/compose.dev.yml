# [Implementation 3]
# 개발 DB의 이름·credential·readiness를 한 resource contract로 고정합니다.
# application migration은 container startup과 분리해 다음 단계의 CLI가 소유합니다.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: board
      POSTGRES_USER: board
      POSTGRES_PASSWORD: board
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board -d board"]
      interval: 2s
      timeout: 2s
      retries: 20
