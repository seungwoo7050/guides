# [Implementation 1] immutable image와 run label로 이 관찰 실행이 소유하는 broker를 식별합니다.
services:
  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    pull_policy: never
    labels:
      dev.guides.run-id: "${GUIDE_RUN_ID:-manual}"
    # [Implementation 2] 단일 process가 broker와 controller 역할을 함께 소유하도록 KRaft를 구성합니다.
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # client·controller·inter-broker listener의 이름과 protocol을 같은 environment에서 연결합니다.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # [Implementation 2-1] broker가 하나뿐인 학습 환경에 맞춰 group 내부 토픽 복제값을 1로 둡니다.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    # [Implementation 3] process 존재가 아니라 broker API 응답을 준비 완료 조건으로 사용합니다.
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 2s
      timeout: 5s
      retries: 45
